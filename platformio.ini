; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<test_motor_x.cpp> -<test_motor_xy.cpp>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.0
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

; Entorno aparte para probar SOLO el motor X, aislado de main.cpp y de todo
; lo demás (Y, sensores, servo, electroimán). Sube con: pio run -e test_x -t upload
[env:test_x]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<test_motor_x.cpp>

; Entorno aparte para probar los motores X e Y juntos, aislado de main.cpp y
; de todo lo demás. Sube con: pio run -e test_xy -t upload
[env:test_xy]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<test_motor_xy.cpp>

